[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msf-harness"
version = "0.1.0"
description = "Metasploit Cursor Harness - agentic penetration testing via MCP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Suzu Labs"},
]
keywords = ["metasploit", "mcp", "pentest", "cursor", "security", "red-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pymetasploit3>=1.0.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Suzu-Testing/metasploit-cursor-harness"
Documentation = "https://github.com/suzulabs/metasploit-cursor-harness/blob/main/docs/SETUP.md"
Repository = "https://github.com/Suzu-Testing/metasploit-cursor-harness"
Issues = "https://github.com/Suzu-Testing/metasploit-cursor-harness/issues"

[project.scripts]
msf-harness = "msf_harness.mcp.server:main"

[tool.setuptools.packages.find]
include = ["msf_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "knowledge-base"]
skips = ["B101", "B603", "B607"]
